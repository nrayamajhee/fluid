[package]
name = "fluid-example"
version = "0.1.0"
authors = ["nrayamajhee <nishan@rayamajhee.com>"]
edition = "2021"

[dependencies]
fluid = { path = "../fluid" }
fluid-macro = { path = "../fluid-macro" }
gloo-utils = "0.2.0"
wasm-bindgen = "0.2.87"
web-sys = { version = "0.3.64", features = ["Element", "Event", "EventTarget", "HtmlInputElement"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3.64", features = ["EventInit", "HtmlElement", "NodeList"] }
